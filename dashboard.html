<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Soo's Kitchen 营业额</title>
<script>
// Visible error reporting: on a device with no dev tools (a tablet), a failure otherwise just looks
// like "the page is blank/stuck". Any script error or failed script download is printed in a red
// bar at the top of the page so it can be read off the screen.
(function(){
  function show(msg){
    var bar = document.getElementById("sk-error-bar");
    if(!bar){
      bar = document.createElement("div");
      bar.id = "sk-error-bar";
      bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:13px/1.4 sans-serif;padding:10px 14px;white-space:pre-wrap;word-break:break-all;max-height:40vh;overflow:auto;";
      (document.body || document.documentElement).appendChild(bar);
    }
    bar.textContent += (bar.textContent ? " | " : "") + msg;
  }
  window.addEventListener("error", function(e){
    var t = e.target;
    if(t && t !== window && (t.tagName === "SCRIPT" || t.tagName === "LINK")){
      show("加载失败: " + (t.src || t.href));
    }else{
      show("错误: " + (e.message || "未知") + (e.lineno ? " (行 " + e.lineno + ")" : ""));
    }
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    show("错误: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
})();
</script>
<link rel="stylesheet" href="dashboard.css?v=202610101230">
</head>
<body>

<header id="topbar">
  <div class="title">Soo's Kitchen 营业额</div>
  <button id="btnCopyCode" class="link-btn hidden">📋 复制连接码</button>
  <button id="btnDisconnect" class="link-btn hidden">断开</button>
</header>

<main id="connectView">
  <div class="card">
    <p class="hint">这是给店主自己远端查看营业额用的页面,员工不会看到。贴上跟 POS 里一样的 Firebase 配置和店铺代号即可查看。</p>
    <label>方法一:连接码 (从已连接的设备上点「📋 复制连接码」)</label>
    <input type="text" id="connectCodeInput" placeholder="贴上连接码 SKD1.xxxx">
    <button id="btnConnectCode" class="primary-btn">用连接码连接</button>
    <label style="margin-top:16px;">方法二:手动贴上配置和店铺代号</label>
    <label>Firebase 项目配置</label>
    <textarea id="cloudConfigInput" rows="5" placeholder='{"apiKey":"...", "authDomain":"...", "projectId":"...", ...}'></textarea>
    <label>店铺代号</label>
    <input type="text" id="cloudShopIdInput" placeholder="跟 POS 设备里的店铺代号一致">
    <button id="btnConnect" class="primary-btn">连接查看</button>
    <p id="connectStatus" class="hint"></p>
  </div>
</main>

<main id="dashboardView" class="hidden">
  <div class="range-bar">
    <button class="range-btn" data-range="today">今天</button>
    <button class="range-btn" data-range="week">本周</button>
    <button class="range-btn" data-range="month">本月</button>
    <button class="range-btn" data-range="custom">自定义</button>
    <button id="btnRefresh" class="link-btn">🔄 刷新</button>
  </div>
  <div id="customRange" class="custom-range hidden">
    <input type="date" id="rangeStart">
    <span>至</span>
    <input type="date" id="rangeEnd">
    <button id="btnApplyCustomRange" class="secondary-btn">套用</button>
  </div>
  <p id="lastRefreshed" class="hint"></p>

  <div class="stat-grid">
    <div class="stat-card"><span class="stat-label">总营业额</span><span class="stat-value" id="statRevenue">RM0.00</span></div>
    <div class="stat-card"><span class="stat-label">订单数</span><span class="stat-value" id="statOrders">0</span></div>
    <div class="stat-card"><span class="stat-label">平均客单价</span><span class="stat-value" id="statAvg">RM0.00</span></div>
    <div class="stat-card"><span class="stat-label">现金 / 电子钱包</span><span class="stat-value" id="statSplit">RM0.00 / RM0.00</span></div>
  </div>

  <section class="panel">
    <h3>每日营业额</h3>
    <div id="dayChart" class="day-chart"></div>
  </section>

  <section class="panel">
    <h3>热销菜品</h3>
    <div id="topItems" class="top-items"></div>
  </section>

  <section class="panel">
    <h3>订单明细</h3>
    <div id="orderTable" class="order-table"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
<script src="dashboard.js?v=202610101230" defer></script>
</body>
</html>
